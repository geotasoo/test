<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주사위 땅따먹기 · 우리나라 (dice-k)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand" title="처음 화면으로">
    <span class="brand-emoji" aria-hidden="true">🎲🗺️</span>
    <div class="brand-text">
      <h1>주사위 땅따먹기 <span class="kr">우리나라</span></h1>
      <div class="sub-line"><span class="ver">dice-k v0.1 (20261116)</span></div>
    </div>
  </div>
  <!-- 게임 중 상태 -->
  <div class="hud" id="hud" hidden>
    <div class="hud-round"><small>라운드</small><b id="hRound">1</b><span>/ <i id="hMax">15</i></span></div>
    <div class="hud-cur" id="hCur"></div>
  </div>
  <div class="actions">
    <button class="tbtn" id="speedBtn" title="AI 차례 속도" hidden></button>
    <button class="tbtn icon" id="soundBtn" title="효과음 켜기/끄기"></button>
    <button class="tbtn icon" id="menuBtn" title="메뉴"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
</header>

<div id="app">
  <!-- 상황판: 차례 순서 (순위 아님) + 차례 끝내기 -->
  <div id="bottom">
    <div id="players" aria-label="차례 순서"></div>
    <button class="endt" id="endBtn" disabled>차례 끝내기</button>
  </div>
  <!-- 굴리기 판 (차례 순서 바로 아래, 눈높이): "김포 옆 서울" + 주사위 + 합 -->
  <section id="rollbar" aria-live="polite"></section>

  <main id="stage">
    <svg id="map" aria-label="대한민국 시군 지도">
      <defs id="defs">
        <marker id="arrowHead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#e03131"/></marker>
      </defs>
      <clipPath id="playClip"></clipPath>
      <g id="vp">
        <g id="gOut"></g>
        <g id="gCells"></g>
        <path id="gProvFaint"/>
        <path id="gProvCase" clip-path="url(#playClip)"/>
        <path id="gProv" clip-path="url(#playClip)"/>
        <g id="gLinks"></g>
        <g id="gHi"></g>
        <g id="gProvNames"></g>
        <g id="gBadges"></g>
        <g id="gNames"></g>
        <g id="gFx"></g>
      </g>
    </svg>
    <div id="loading">지도를 불러오는 중…</div>

    <div class="zoom" aria-label="확대·축소">
      <button id="zoomIn" title="확대"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="zoomOut" title="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button id="zoomFit" title="맵 전체 보기"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>

    <button class="misbtn" id="misBtn" hidden>🎯 미션</button>
    <aside class="mis" id="misPanel" hidden aria-label="미션">
      <header><b>🎯 미션</b><button class="close" id="misClose" title="닫기">✕</button></header>
      <div id="misBody"></div>
    </aside>
    <div class="toast" id="toast" hidden></div>
    <div class="notice" id="notice" hidden></div>
  </main>

</div>

<!-- 처음 화면 (게임 설정): PC는 두 칸, 폰은 두 단계 -->
<div class="overlay" id="lobby" hidden>
  <div class="card lobby" data-step="1">
    <h2>🎲🗺️ 주사위 땅따먹기 <small>우리나라 시·군</small></h2>
    <div class="lb-cols">
      <section class="lb-map">
        <h3>지도</h3>
        <div class="mapgroup">전국 · 권역</div>
        <div class="maps" id="mapSeg"></div>
        <div class="mapgroup">도 하나 <small>특별·광역시는 빠져요</small></div>
        <div class="maps six" id="mapSeg2"></div>
        <div class="card-actions step1">
          <button class="sub" data-resume hidden>▶ 이어서 하기</button>
          <button class="go" id="nextBtn">다음 ▶</button>
        </div>
      </section>
      <section class="lb-set">
        <div class="picked step2"><span>지도</span><b id="pickedMap"></b><button class="link" id="backBtn">바꾸기</button></div>
        <h3>플레이어 <small id="seatSum"></small></h3>
        <p class="hint">이름은 <b>이 지도 속 지역</b>으로 정해져요. 주사위를 누르면 <b>색</b>, 아래 글자를 누르면 <b>사람 · AI · 빈자리</b>가 바뀌어요.</p>
        <div class="seats" id="seats"></div>
        <div class="seat-foot"><span id="seatNote"></span><button class="link" id="rerollBtn">🔀 이름 다시 뽑기</button></div>
        <div class="opt-row">
          <div><h3>모드</h3><div class="seg" id="capSeg"><button data-cap="5">주사위 5개<small>빠른 템포</small></button><button data-cap="8">주사위 8개<small>깊은 전략</small></button></div></div>
          <div><h3>라운드</h3><div class="seg" id="roundSeg"><button data-r="5">5</button><button data-r="10">10</button><button data-r="15">15</button></div></div>
        </div>
        <div class="card-actions">
          <button class="sub step2-back" id="backBtn2">◀ 지도</button>
          <button class="sub" data-resume hidden>▶ 이어서 하기</button>
          <button class="go" id="startBtn">새 게임 시작</button>
        </div>
      </section>
    </div>
  </div>
</div>

<!-- 차례 넘기기 (사람이 2명 이상일 때) -->
<div class="overlay handoff" id="handoff" hidden>
  <button class="hcard" id="handoffBtn"><span class="hicon" id="handoffIcon"></span><b id="handoffName"></b><span>님 차례입니다</span><small>눌러서 시작</small></button>
</div>

<!-- 메뉴 -->
<div class="overlay" id="menu" hidden>
  <div class="card small">
    <h2>메뉴</h2>
    <div class="menu-row"><span>지역 이름표</span><div class="seg tiny" id="labelSeg"><button data-l="1">켜기</button><button data-l="0">끄기</button></div></div>
    <div class="menu-row"><span>AI 차례 속도</span><div class="seg tiny" id="speedSeg"><button data-s="normal">보통</button><button data-s="fast">빠르게</button></div></div>
    <div class="menu-row"><span>효과음</span><div class="seg tiny" id="sndSeg"><button data-snd="1">켜기</button><button data-snd="0">끄기</button></div></div>
    <p class="menu-note">게임은 한 수마다 저장돼요. 처음 화면으로 나가도 <b>이어서 하기</b>로 돌아올 수 있어요.</p>
    <div class="card-actions">
      <button class="sub quit" id="quitBtn">게임 그만하기</button>
      <button class="sub" id="toLobby">처음 화면으로</button>
      <button class="go" id="menuClose">닫기</button>
    </div>
  </div>
</div>

<!-- 확인 창 -->
<div class="overlay" id="confirm" hidden>
  <div class="card small">
    <p class="confirm-msg" id="confirmMsg"></p>
    <div class="card-actions">
      <button class="sub" id="confirmNo">아니요</button>
      <button class="go" id="confirmYes">새로 시작</button>
    </div>
  </div>
</div>

<!-- 결과 -->
<div class="overlay" id="result" hidden>
  <div class="card">
    <h2 id="rTitle">🏁 게임 끝!</h2>
    <p class="rsub" id="rSub"></p>
    <div class="ranks" id="ranks"></div>
    <div id="gots"></div>
    <div class="card-actions">
      <button class="sub" id="rMap">지도 보기</button>
      <button class="go" id="rAgain">새 게임</button>
    </div>
  </div>
</div>

<canvas id="fxCanvas" hidden></canvas>
<script src="data/kr161.js"></script>
<script src="engine.js"></script>
<script src="game.js"></script>
</body>
</html>
