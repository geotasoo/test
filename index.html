<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세계 상징 사전</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #1e2a35; --ink-muted: #526070; --ink-faint: #8a9aa8;
    --paper: #fdf6e3; --paper-dark: #eef2f7;
    --accent: #3d6b8a; --accent-light: #ddeef7;
    --border: #d0d8df; --col1: 210px;
    --col-flag-bg: #fdf6e3; --col-emblem-bg: #eef2f7; --col-anthem-bg: #fdf4f4; --col-info-bg: #e8f0e9;
  }
  /* ── 🎨 화이트 테마: 1단(사이드바) 제외 전부 흰 배경 ── */
  body[data-theme="white"] {
    --paper: #ffffff; --paper-dark: #f4f6f8;
    --col-flag-bg: #ffffff; --col-emblem-bg: #ffffff; --col-anthem-bg: #ffffff; --col-info-bg: #ffffff;
  }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; display: flex; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--col1); height: 100vh; background: #3d4f5c; color: #f0f4f7;
    position: fixed; top: 0; left: 0; display: flex; flex-direction: column;
    z-index: 100; overflow: hidden;
  }
  #sidebar-header { padding: 1.1rem 1.1rem 0.8rem; border-bottom: 1px solid #4d6070; flex-shrink: 0; }
  #sidebar-header h1 { font-family: 'Noto Serif KR', serif; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; }
  #sidebar-header p { font-size: 10px; color: #6b7494; margin-top: 2px; letter-spacing: 0.05em; }

  /* 테마 팔레트 */
  #theme-picker { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
  .theme-dot { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; border: 1px solid #8a9aa8; padding: 0; transition: box-shadow 0.15s; }
  .theme-dot[data-theme="paper"] { background: #fdf6e3; }
  .theme-dot[data-theme="white"] { background: #ffffff; }
  .theme-dot.active { box-shadow: 0 0 0 2px var(--accent); border-color: var(--accent); }
  #theme-picker .tp-label { font-size: 9px; color: #6b7494; letter-spacing: 0.05em; margin-right: 2px; }

  #search-wrap { padding: 0.6rem 1.1rem; border-bottom: 1px solid #4d6070; flex-shrink: 0; }
  #search {
    width: 100%; background: #4d6070; border: 1px solid #4d6070; border-radius: 3px;
    color: #fff; font-size: 12px; padding: 5px 9px; font-family: inherit; outline: none;
  }
  #search::placeholder { color: #8a9aa8; }
  #search:focus { border-color: #3a3f5c; }
  #region-tabs { display: flex; flex-wrap: wrap; gap: 3px; padding: 0.5rem 1.1rem; border-bottom: 1px solid #4d6070; flex-shrink: 0; }
  .rtab { font-size: 10px; padding: 2px 6px; border-radius: 2px; cursor: pointer; background: transparent; color: #c5c9d8; border: 1px solid #4d6070; transition: all 0.15s; font-family: inherit; }
  .rtab:hover { background: #4d6070; color: #fff; }
  .rtab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tag-filter-bar { padding: 0.5rem 1.1rem; border-bottom: 1px solid #4d6070; flex-shrink: 0; }
  #country-list { flex: 1; overflow-y: auto; }
  #country-list::-webkit-scrollbar { width: 3px; }
  #country-list::-webkit-scrollbar-thumb { background: #4d6070; }
  .country-item { display: flex; align-items: center; gap: 7px; padding: 6px 1.1rem; cursor: pointer; transition: background 0.1s; border-left: 2px solid transparent; }
  .country-item:hover { background: #4d6070; }
  .country-item.active { background: #4d6070; border-left-color: var(--accent); }
  .ci-flag { width: 20px; height: 13px; object-fit: cover; border-radius: 1px; flex-shrink: 0; border: 1px solid #252525; }
  .ci-name { font-size: 11px; color: #c5c9d8; flex: 1; line-height: 1.3; }
  .ci-name small { display: block; font-size: 9px; color: #8a9db0; margin-top: 1px; }
  .ci-name .fav-star { color: #e8b339; font-size: 9px; }
  .ci-status { width: 5px; height: 5px; border-radius: 50%; background: #222; flex-shrink: 0; }
  .ci-status.ready { background: var(--accent); }

  /* ── MAIN ── */
  #main { margin-left: var(--col1); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

  /* Welcome */
  #welcome { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 3rem; text-align: center; }
  #welcome .globe { font-size: 52px; margin-bottom: 1rem; opacity: 0.4; }
  #welcome h2 { font-family: 'Noto Serif KR', serif; font-size: 22px; font-weight: 600; margin-bottom: 0.5rem; }
  #welcome p { font-size: 13px; color: var(--ink-muted); line-height: 1.8; max-width: 340px; }
  .progress-bar { margin-top: 1.25rem; width: 240px; height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 2px; }
  .progress-label { margin-top: 5px; font-size: 11px; color: var(--ink-faint); }

  /* 로딩 스피너 */
  .spinner {
    width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 1rem auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Country page */
  #country-page { display: none; flex-direction: column; flex: 1; }

  /* TOP BAR */
  #top-bar {
    padding: 1.25rem 2rem 1rem; background: #fff; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; flex-wrap: wrap; gap: 12px; position: sticky; top: 0; z-index: 10;
  }
  #top-bar h2 { font-family: 'Noto Serif KR', serif; font-size: 26px; font-weight: 600; color: var(--ink); flex-shrink: 0; }
  #top-bar .en { font-size: 13px; color: var(--ink-faint); letter-spacing: 0.03em; flex-shrink: 0; }
  .tag-list { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  .tag-pill { font-size: 10px; padding: 2px 8px; border-radius: 99px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .tag-pill.region { background: var(--accent-light); color: var(--accent); border: 1px solid #e8d0cb; cursor: default; }
  .tag-pill.symbol { background: #e4ecf2; color: #2d5470; border: 1px solid #b8cdd9; }
  .tag-pill.symbol:hover, .tag-pill.symbol.active { background: #4a6278; color: #fff; }
  .tag-pill.color-tag { background: var(--paper-dark); color: var(--ink-muted); border: 1px solid var(--border); }
  .tag-pill.color-tag:hover, .tag-pill.color-tag.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 이전/다음/즐겨찾기 버튼 */
  #tb-actions { margin-left: auto; display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
  .nav-btn, #fav-btn {
    border: 1px solid var(--border); background: #fff; border-radius: 3px;
    font-size: 13px; padding: 3px 10px; cursor: pointer; color: var(--ink-muted);
    font-family: inherit; transition: all 0.15s; line-height: 1.4;
  }
  .nav-btn:hover, #fav-btn:hover { background: var(--paper-dark); }
  #fav-btn.faved { color: #e8b339; border-color: #e8b339; }

  /* Sidebar tag pills */
  .tag-filter-bar .tag-pill.symbol { background: #4d6070; color: #c5c9d8; border: 1px solid #4d6070; }
  .tag-filter-bar .tag-pill.symbol:hover, .tag-filter-bar .tag-pill.symbol.active { background: #4a6278; color: #fff; border-color: #4a6278; }
  .tag-filter-bar .tag-pill.color-tag { background: #4d6070; color: #c5c9d8; border: 1px solid #4d6070; }
  .tag-filter-bar .tag-pill.color-tag:hover, .tag-filter-bar .tag-pill.color-tag.active { background: #666; color: #fff; border-color: #666; }

  /* 3-COLUMN CONTENT */
  #content-cols { flex: 1; align-items: start; }
  .content-col { padding: 1.75rem 1.75rem 4rem; border-right: 1px solid var(--border); min-width: 0; }
  .content-col:last-child { border-right: none; }
  .col-flag { background: var(--col-flag-bg); }
  .col-emblem { background: var(--col-emblem-bg); color: #1e2a35; }
  .col-anthem { background: var(--col-anthem-bg); }

  .col-header { display: flex; align-items: center; gap: 8px; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--border); }
  .col-icon { width: 22px; height: 22px; background: var(--accent-light); border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  .col-title { font-size: 11px; letter-spacing: 0.1em; color: var(--ink-faint); text-transform: uppercase; font-weight: 500; }

  /* 국기: 단 가로폭 100%, 비율 유지 */
  .flag-img { width: 100%; height: auto; border: 1px solid var(--border); display: block; margin-bottom: 1.25rem; }

  /* ── 국장: 높이 제한 없이 단 가로폭에 정확히 맞춤 ──
     고정 height를 없애고 width:100% + height:auto 로 변경.
     인라인 SVG는 viewBox 비율(JS에서 aspect-ratio로 보강)에 따라
     단이 커지면 함께 커지고 줄어들면 함께 줄어든다. */
  .emblem-wrap { width: 100%; margin-bottom: 1.25rem; }
  .emblem-img { width: 100%; height: auto; display: block; }
  .emblem-wrap svg { width: 100%; height: auto; display: block; }

  .col-desc { font-size: 13px; line-height: 1.95; color: var(--ink); }
  .col-desc br { display: block; margin-top: 0.75rem; content: ''; }
  .source-line { margin-top: 0.75rem; font-size: 10px; color: var(--ink-faint); }
  .source-line a { color: var(--accent); text-decoration: none; }
  .source-line a:hover { text-decoration: underline; }
  .coming-soon { font-size: 12px; color: var(--ink-faint); font-style: italic; padding: 1rem; background: rgba(0,0,0,0.03); border-radius: 2px; border: 1px dashed var(--border); text-align: center; }

  /* Anthem */
  .anthem-name { margin-bottom: 1.25rem; }
  .anthem-name .title { font-family: 'Noto Sans KR', sans-serif; font-size: 17px; font-weight: 600; color: var(--ink); }
  .anthem-name .sub { font-size: 11px; color: var(--ink-faint); margin-top: 3px; }
  .anthem-toggle { display: flex; gap: 4px; margin-bottom: 1rem; flex-wrap: wrap; }
  .atbtn { font-size: 11px; padding: 3px 9px; border-radius: 2px; border: 1px solid var(--border); background: transparent; color: var(--ink-muted); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .atbtn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .atbtn:hover:not(.active) { background: #e8e0d5; }
  .verse-title { font-size: 10px; letter-spacing: 0.08em; color: var(--ink-faint); text-transform: uppercase; margin: 1rem 0 4px; font-weight: 500; }
  .verse-title:first-child { margin-top: 0; }
  .verse-line { font-size: 13px; line-height: 2.1; color: var(--ink); font-family: 'Noto Sans KR', sans-serif; }

  .yt-btn-sm {
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: #f00; color: #fff; border-radius: 2px;
    font-size: 10px; font-weight: 500; text-decoration: none; font-family: inherit; border: none; cursor: pointer; transition: background 0.15s; flex-shrink: 0;
  }
  .yt-btn-sm:hover { background: #c00; }

  /* ── INFO COLUMN (col 2) ── */
  #col-info {
    background: var(--col-info-bg); color: #1e2a35; padding: 2rem 1.5rem 4rem; min-height: 100vh;
    border-right: 1px solid var(--border); min-width: 180px; max-width: 260px; width: fit-content; flex-shrink: 0;
  }
  .info-name-kr { font-family: 'Noto Serif KR', serif; font-size: clamp(16px, 2vw, 26px); font-weight: 600; color: var(--ink); line-height: 1.25; white-space: nowrap; overflow: visible; }
  .info-name-en { font-size: 11px; color: var(--ink-faint); margin-top: 4px; letter-spacing: 0.03em; line-height: 1.4; }
  .info-region { display: inline-block; margin-top: 8px; font-size: 10px; padding: 2px 8px; background: var(--accent-light); color: var(--accent); border-radius: 2px; }
  .info-divider { border: none; border-top: 1px solid var(--border); margin: 1.25rem 0; }
  .nickname-list { display: flex; flex-direction: column; gap: 4px; }
  .nickname-item { font-size: 12px; color: var(--ink-muted); line-height: 1.6; }
  .nickname-item::before { content: '·  '; color: var(--accent); }
  .info-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 1rem; }
  .info-tag { font-size: 10px; padding: 2px 7px; border-radius: 99px; }
  .info-tag.symbol { background: #e4ecf2; color: #2d5470; border: 1px solid #b8cdd9; }
  .info-tag.color-tag { background: #fff; color: var(--ink-muted); border: 1px solid var(--border); }

  .map-wrap { margin-top: 1.25rem; border-radius: 3px; overflow: hidden; border: 1px solid var(--border); }
  .map-wrap iframe { display: block; width: 100%; height: 200px; border: none; }

  .safety-btn {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 1rem; padding: 7px 10px;
    background: #f0fdf4; color: #16a34a; border-radius: 3px; font-size: 11px; font-weight: 500;
    text-decoration: none; font-family: inherit; border: 1px solid #bbf7d0; transition: all 0.15s; width: 100%;
  }
  .safety-btn:hover { background: #dcfce7; }

  .tag-toggle-btn {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--ink-faint); cursor: pointer;
    background: none; border: none; padding: 0; font-family: inherit; margin-top: 0.75rem; transition: color 0.15s;
  }
  .tag-toggle-btn:hover { color: var(--ink-muted); }
  .tag-toggle-btn .arrow { transition: transform 0.2s; display: inline-block; }
  .tag-toggle-btn.open .arrow { transform: rotate(180deg); }
  .tags-collapsible { overflow: hidden; transition: max-height 0.25s ease, opacity 0.2s; max-height: 0; opacity: 0; }
  .tags-collapsible.open { max-height: 300px; opacity: 1; }

  /* ── 모바일 탭 & 반응형 ── */
  .mobile-tabs { display: none; }

  @media (max-width: 860px) {
    body { flex-direction: column; }
    #sidebar { width: 100%; height: auto; position: relative; min-height: auto; }
    #main { margin-left: 0; }
    #four-col-wrap { flex-direction: column; }
    #content-cols { grid-template-columns: 1fr !important; }
    .content-col { min-height: auto; border-right: none; border-bottom: 1px solid var(--border); }

    .mobile-tabs {
      display: flex !important; position: sticky; top: 0; z-index: 20;
      background: #fff; border-bottom: 1px solid var(--border);
    }
    .mobile-tab-btn {
      flex: 1; padding: 10px 4px; font-size: 12px; font-weight: 500;
      border: none; background: transparent; cursor: pointer;
      color: var(--ink-muted); border-bottom: 2px solid transparent;
      font-family: inherit; transition: all 0.15s;
    }
    .mobile-tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    #col-info, .content-col {
      display: none; width: 100% !important; max-width: 100% !important;
      min-height: auto !important; height: auto !important;
      border-right: none !important; border-bottom: 1px solid var(--border);
      position: relative !important;
    }
    #col-info.mobile-active, .content-col.mobile-active { display: block; }
  }
</style>
</head>
<body data-theme="paper">

<nav id="sidebar">
  <div id="sidebar-header">
    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div>
        <h1 style="cursor:pointer;" onclick="goHome()" title="홈으로">세계 상징 사전</h1>
        <p>WORLD SYMBOL DICTIONARY</p>
        <p style="font-size:9px;color:#8a9aa8;margin-top:3px;letter-spacing:0.03em;">@geotasoo / 20260612</p>
        <div id="theme-picker">
          <span class="tp-label">THEME</span>
          <button class="theme-dot active" data-theme="paper" title="크림 테마" onclick="setTheme('paper')"></button>
          <button class="theme-dot" data-theme="white" title="화이트 테마" onclick="setTheme('white')"></button>
        </div>
      </div>
      <button id="random-btn" title="랜덤 나라" onclick="selectRandom()" style="background:none;border:none;cursor:pointer;font-size:20px;padding:4px;line-height:1;opacity:0.7;transition:opacity 0.15s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0.7">🎲</button>
    </div>
  </div>
  <div id="search-wrap">
    <input id="search" type="text" placeholder="나라 이름 검색..." />
  </div>
  <div id="region-tabs">
    <button class="rtab active" data-region="all" data-label="전체">전체</button>
    <button class="rtab" data-region="아시아" data-label="아시아">아시아</button>
    <button class="rtab" data-region="유럽" data-label="유럽">유럽</button>
    <button class="rtab" data-region="아프리카" data-label="아프리카">아프리카</button>
    <button class="rtab" data-region="아메리카" data-label="아메리카">아메리카</button>
    <button class="rtab" data-region="오세아니아" data-label="오세아니아">오세아니아</button>
    <button class="rtab" data-region="fav" data-label="★" title="즐겨찾기">★</button>
  </div>
  <div class="tag-filter-bar">
    <button class="tag-toggle-btn" style="color:#6b7494;margin-top:0;" onclick="this.classList.toggle('open');document.getElementById('tag-pills-wrap').classList.toggle('open')">
      <span class="arrow" style="color:#6b7494">▾</span> <span style="letter-spacing:0.06em;font-size:9px;text-transform:uppercase;">태그 필터</span>
    </button>
    <div class="tags-collapsible" id="tag-pills-wrap">
      <div id="tag-pills" style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;"></div>
    </div>
  </div>
  <div id="country-list"></div>
</nav>

<main id="main">
  <div id="welcome">
    <div class="globe">🌍</div>
    <h2>세계 상징 사전</h2>
    <p>국기·국장·국가 속에 담긴 그 땅의 지리, 역사, 삶의 방식을 읽어보세요.</p>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <p class="progress-label" id="progress-label">데이터를 불러오는 중...</p>
    <div class="spinner" id="load-spinner"></div>
  </div>

  <div id="country-page">
    <div id="top-bar">
      <h2 id="tb-name"></h2>
      <span class="en" id="tb-en"></span>
      <div class="tag-list" id="tb-tags"></div>
      <div id="tb-actions">
        <button id="fav-btn" title="즐겨찾기" onclick="toggleFav()">☆</button>
        <button class="nav-btn" title="이전 나라" onclick="navCountry(-1)">←</button>
        <button class="nav-btn" title="다음 나라" onclick="navCountry(1)">→</button>
      </div>
    </div>
    <div class="mobile-tabs" id="mobile-tabs">
      <button class="mobile-tab-btn active" onclick="switchMobileTab('info', this)">🌍 정보</button>
      <button class="mobile-tab-btn" onclick="switchMobileTab('flag', this)">🏳️ 국기</button>
      <button class="mobile-tab-btn" onclick="switchMobileTab('emblem', this)">🔰 국장</button>
      <button class="mobile-tab-btn" onclick="switchMobileTab('anthem', this)">🎵 국가</button>
    </div>
    <div id="four-col-wrap" style="display:flex;flex:1;align-items:stretch;min-height:100vh;">
      <div id="col-info" class="mobile-active"></div>
      <div id="content-cols" style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;align-items:stretch;">
        <div class="content-col col-flag" id="col-flag"></div>
        <div class="content-col col-emblem" id="col-emblem"></div>
        <div class="content-col col-anthem" id="col-anthem"></div>
      </div>
    </div>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════
   구글 시트 열 구성 (헤더 이름으로 읽으므로 열 순서는 자유.
   아래는 권장 배치 — 사람이 보기 편한 순서)

   A  code           나라 코드 (kr, jp ...)  ※ URL 해시 공유에도 사용
   B  name           한글 이름
   C  name_en        영문 이름
   D  name_local     현지어 이름
   E  region         아시아 / 유럽 / 아프리카 / 아메리카 / 오세아니아
   F  nicknames      별명 (쉼표 구분)
   G  tags           태그 (쉼표 구분)
   H  colors         색 태그 (쉼표 구분)
   I  flag_url       국기 이미지 URL
   J  flag_desc      국기 해설
   K  emblem_url     국장 이미지 URL
   L  emblem_desc    국장 해설

   ── anthem_lyrics 셀 작성 형식 ──
   한 셀 안에 줄바꿈(Alt+Enter 또는 Cmd+Enter)으로 작성.

   각 블록 첫 줄은 [언어 라벨], 절 제목은 # 으로 시작, 절 사이는 빈 줄.

   [일본어 (원문)]
   #1절
   君が代は
   千代に八千代に
   ===
   [한국어 번역]
   #1절
   임금의 치세는
   천 년이고 팔천 년이고

   가사 셀이 비어 있으면 코드 안의 ANTHEMS 폴백 데이터를 사용한다.
   ════════════════════════════════════════════════════════════ */

/* ── 🌟 [수정] CSV 파서 v2: 따옴표 안 줄바꿈 지원 ──
   가사처럼 셀 안에 줄바꿈이 들어가는 데이터가 생기면서
   '줄 단위로 먼저 자르는' 기존 방식은 데이터를 깨뜨린다.
   전체 텍스트를 문자 단위로 스캔하며 따옴표 상태를 추적한다. */
function parseCSV(text) {
  const rows = [];
  let row = [], cur = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"') {
        if (text[i+1] === '"') { cur += '"'; i++; }   // "" → 따옴표 이스케이프
        else inQ = false;
      } else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || (row[0] && row[0].trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
  }
  if (cur !== '' || row.length) {
    row.push(cur);
    if (row.length > 1 || (row[0] && row[0].trim() !== '')) rows.push(row);
  }
  if (!rows.length) return [];
  const headers = rows[0].map(h => h.trim());
  return rows.slice(1).map(vals => {
    const obj = {};
    headers.forEach((h, i) => obj[h] = (vals[i] || '').trim());
    return obj;
  }).filter(r => r.code);
}

/* ── 가사 텍스트 파서 ── */
function parseAnthemText(raw) {
  if (!raw || !raw.trim()) return null;
  const blocks = raw.split(/\r?\n\s*===+\s*\r?\n/);
  const parseBlock = (b) => {
    const lines = b.split(/\r?\n/);
    let lang = '';
    const verses = [];
    let cur = null;
    lines.forEach(line => {
      const t = line.trim();
      if (!lang && /^\[.*\]$/.test(t)) { lang = t.slice(1, -1).trim(); return; }
      if (t.startsWith('#')) { cur = { title: t.slice(1).trim(), lines: [] }; verses.push(cur); return; }
      if (t === '') { cur = null; return; }
      if (!cur) { cur = { title: '', lines: [] }; verses.push(cur); }
      cur.lines.push(t);
    });
    return verses.length ? { lang: lang, verses: verses } : null;
  };
  const original = parseBlock(blocks[0]);
  if (!original) return null;
  const translation = blocks.length > 1 ? parseBlock(blocks.slice(1).join('\n===\n')) : null;
  return { original, translation };
}

function csvToCountry(row) {
  return {
    code: row.code,
    name: row.name,
    en: row.name_en,
    local: row.name_local || '',
    region: row.region,
    nicknames: row.nicknames ? row.nicknames.split(',').map(s=>s.trim()).filter(Boolean) : [],
    tags: row.tags ? row.tags.split(',').map(s=>s.trim()).filter(Boolean) : [],
    colors: row.colors ? row.colors.split(',').map(s=>s.trim()).filter(Boolean) : [],
    emblem: row.emblem_url || '',
    flag: row.flag_url || '',
    anthem: { title: row.anthem_title || '', sub: row.anthem_sub || '' },
    anthemData: parseAnthemText(row.anthem_lyrics || ''),   // 시트 가사 (있으면 우선)
    emblemDesc: row.emblem_desc || '',
    flagDesc: row.flag_desc || '',
    safetyUrl: row.safety_url || '',
    flagWiki: row.flag_wiki || row.flag_wiki_link || '',
    emblemWiki: row.emblem_wiki || row.emblem_wiki_link || '',
    ready: !!(row.emblem_desc && row.flag_desc)
  };
}

async function loadFromSheet() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('fetch failed');
    const text = await res.text();
    const rows = parseCSV(text);
    COUNTRIES = rows.map(csvToCountry);
    console.log('시트에서 로드:', COUNTRIES.length, '개 나라');
  } catch(e) {
    console.warn('시트 로드 실패, 로컬 데이터 사용:', e);
    COUNTRIES = FALLBACK_COUNTRIES;
  }

  // 가나다 순 정렬
  COUNTRIES.sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ko'));

  // 로딩 스피너 종료
  const sp = document.getElementById('load-spinner');
  if (sp) sp.style.display = 'none';

  filtered = [...COUNTRIES];
  buildTagFilter();
  updateRegionCounts();
  buildList();
  updateProgress();

  if (filtered.length > 0) {
    // URL 해시(#kr 등)가 있으면 해당 나라로, 없으면 랜덤
    const hashCode = decodeURIComponent(location.hash.slice(1));
    const hi = hashCode ? filtered.findIndex(c => c.code === hashCode) : -1;
    if (hi >= 0) {
      selectCountry(hi);
      document.querySelectorAll('.country-item')[hi]?.scrollIntoView({block:'nearest'});
    } else {
      selectCountry(Math.floor(Math.random() * filtered.length));
    }
  }
}

/* ── 지역 탭에 나라 수 표시: 전체 (17), 아시아 (17) ... ── */
function updateRegionCounts() {
  document.querySelectorAll('.rtab').forEach(btn => {
    const r = btn.dataset.region;
    const label = btn.dataset.label || btn.textContent;
    let n;
    if (r === 'all') n = COUNTRIES.length;
    else if (r === 'fav') n = COUNTRIES.filter(c => FAVS.has(c.code)).length;
    else n = COUNTRIES.filter(c => c.region === r).length;
    btn.textContent = `${label} (${n})`;
  });
}

function updateProgress() {
  const total = COUNTRIES.length;
  const ready = COUNTRIES.filter(c=>c.ready).length;
  const pct = total ? Math.round(ready/total*100) : 0;
  const pf = document.getElementById('progress-fill');
  const pl = document.getElementById('progress-label');
  if(pf) pf.style.width = pct + '%';
  if(pl) pl.textContent = `해설 완성 ${ready} / ${total}개 나라 (${pct}%)`;
}

function buildList() {
  const ul = document.getElementById('country-list');
  ul.innerHTML = '';
  filtered.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'country-item' + (i === currentIdx ? ' active' : '');
    const star = FAVS.has(c.code) ? ' <span class="fav-star">★</span>' : '';
    div.innerHTML = `
      <img class="ci-flag" src="${c.flag}" alt="" loading="lazy" onerror="this.style.display='none'">
      <span class="ci-name">${c.name}${star}<small>${c.en}</small></span>
      <span class="ci-status ${c.ready ? 'ready' : ''}"></span>
    `;
    div.onclick = () => selectCountry(i);
    ul.appendChild(div);
  });
}

function selectCountry(idx) {
  if (idx < 0 || idx >= filtered.length) return;
  currentIdx = idx;
  document.querySelectorAll('.country-item').forEach((el, i) => {
    el.classList.toggle('active', i === idx);
  });
  const c = filtered[idx];
  renderPage(c);

  // URL 해시 갱신 (히스토리 누적 없이) → 링크 복사로 바로 공유 가능
  if (c.code) history.replaceState(null, '', '#' + c.code);

  document.getElementById('welcome').style.display = 'none';
  document.getElementById('country-page').style.display = 'flex';
}

/* 이전/다음 나라 버튼 */
function navCountry(dir) {
  const ni = currentIdx + dir;
  if (ni < 0 || ni >= filtered.length) return;
  selectCountry(ni);
  document.querySelectorAll('.country-item')[ni]?.scrollIntoView({block:'nearest'});
}

/* 즐겨찾기 토글 */
function toggleFav() {
  const c = filtered[currentIdx];
  if (!c) return;
  if (FAVS.has(c.code)) FAVS.delete(c.code);
  else FAVS.add(c.code);
  saveFavs();
  updateFavBtn(c);
  updateRegionCounts();
  if (currentRegion === 'fav') {
    // 즐겨찾기 보기 중 해제하면 목록에서 빠져야 하므로 필터 재적용
    applyFilter(document.getElementById('search').value.trim().toLowerCase(), currentRegion);
  } else {
    buildList();
  }
}

function updateFavBtn(c) {
  const btn = document.getElementById('fav-btn');
  if (!btn) return;
  const on = FAVS.has(c.code);
  btn.textContent = on ? '★' : '☆';
  btn.classList.toggle('faved', on);
}

function applyFilter(q, region) {
  filtered = COUNTRIES.filter(c => {
    const matchRegion = region === 'all'
      || (region === 'fav' ? FAVS.has(c.code) : c.region === region);
    const matchQ = !q || c.name.includes(q) || c.en.toLowerCase().includes(q);
    const matchTag = !activeTagFilter || 
      (activeTagFilter.type === 'symbol' && (c.tags||[]).includes(activeTagFilter.value)) ||
      (activeTagFilter.type === 'color' && (c.colors||[]).includes(activeTagFilter.value));
    return matchRegion && matchQ && matchTag;
  });
  currentIdx = 0;
  buildList();
  if(filtered.length > 0) {
    selectCountry(0);
  } else {
    document.getElementById('country-page').style.display = 'none';
    document.getElementById('welcome').style.display = 'flex';
  }
}

document.getElementById('search').addEventListener('input', function() {
  applyFilter(this.value.trim().toLowerCase(), currentRegion);
});

document.querySelectorAll('.rtab').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.rtab').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    currentRegion = this.dataset.region;
    applyFilter(document.getElementById('search').value.trim().toLowerCase(), currentRegion);
  });
});

function buildTagFilter() {
  const allTags = new Set();
  const allColors = new Set();
  COUNTRIES.forEach(c => {
    (c.tags||[]).forEach(t => allTags.add(t));
    (c.colors||[]).forEach(t => allColors.add(t));
  });
  
  const container = document.getElementById('tag-pills');
  container.innerHTML = '';
  
  [...allTags].sort().forEach(tag => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill symbol';
    btn.textContent = tag;
    btn.onclick = () => toggleTagFilter(tag, 'symbol', btn);
    container.appendChild(btn);
  });
  
  [...allColors].sort().forEach(color => {
    const btn = document.createElement('button');
    btn.className = 'tag-pill color-tag';
    btn.textContent = color;
    btn.onclick = () => toggleTagFilter(color, 'color', btn);
    container.appendChild(btn);
  });
}

function toggleTagFilter(value, type, btn) {
  const isActive = btn.classList.contains('active');
  document.querySelectorAll('#tag-pills .tag-pill').forEach(b => b.classList.remove('active'));
  if (!isActive) {
    btn.classList.add('active');
    activeTagFilter = { value, type };
  } else {
    activeTagFilter = null;
  }
  applyFilter(document.getElementById('search').value.trim().toLowerCase(), currentRegion);
}

function ytSearchUrl(en) { return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(en + ' national anthem official'); }

/* 시트 가사(c.anthemData)가 있으면 우선, 없으면 ANTHEMS 폴백 */
function renderAnthem(c) {
  const data = c.anthemData || ANTHEMS[c.code];
  if (!data) return '<div class="coming-soon">가사 준비 중입니다.</div>';

  const hasTranslation = !!data.translation;
  const id = 'anthem-' + c.code;
  let html = '<div class="anthem-viewer" id="' + id + '">';

  if (hasTranslation) {
    html += '<div class="anthem-toggle">';
    html += '<button class="atbtn" data-atype="original" onclick="switchAnthem(\''+c.code+'\', \'original\')">'+(data.original.lang || '원문')+'</button>';
    html += '<button class="atbtn active" data-atype="translation" onclick="switchAnthem(\''+c.code+'\', \'translation\')">'+(data.translation.lang || '한국어 번역')+'</button>';
    html += '</div>';
  }

  html += renderVerses(data.original.verses, c.code, 'original', !hasTranslation);
  if (hasTranslation) {
    html += renderVerses(data.translation.verses, c.code, 'translation', true);
  }
  html += '</div>';
  return html;
}

function renderVerses(verses, code, type, visible) {
  let html = '<div class="anthem-verses" data-code="'+code+'" data-type="'+type+'" style="display:'+(visible?'block':'none')+'">';
  verses.forEach(v => {
    if (v.title) html += '<div class="verse-title">'+v.title+'</div>';
    html += '<div class="verse-lines">';
    v.lines.forEach(l => { html += '<div class="verse-line">'+l+'</div>'; });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

/* 버튼 활성화를 텍스트 매칭 대신 data-atype 으로 판별 (시트 가사의 자유로운 라벨 대응) */
function switchAnthem(code, type) {
  const viewer = document.getElementById('anthem-' + code);
  if (!viewer) return;
  viewer.querySelectorAll('.anthem-verses').forEach(el => {
    el.style.display = el.dataset.type === type ? 'block' : 'none';
  });
  viewer.querySelectorAll('.atbtn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.atype === type);
  });
}

/* ── 국장 SVG 로더 v2 (스타일 보존 + viewBox 복원 + DOMParser) ── */
const EMBLEM_CACHE = {};

async function loadEmblemSVG(url, containerId) {
  const wrap = document.getElementById(containerId);
  if (!wrap) return;

  if (!url) { wrap.innerHTML = ''; return; }

  const cleanUrl = url.toLowerCase().split('?')[0];
  if (!cleanUrl.endsWith('.svg')) {
    wrap.innerHTML = `<img class="emblem-img" src="${url}" alt="국장" onerror="this.style.display='none'">`;
    return;
  }

  try {
    let svgText = EMBLEM_CACHE[url];
    if (!svgText) {
      const res = await fetch(url);
      if (!res.ok) throw new Error('SVG fetch failed: ' + res.status);
      svgText = await res.text();
      EMBLEM_CACHE[url] = svgText;
    }

    const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
    const svg = doc.documentElement;
    if (svg.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) {
      throw new Error('SVG parse failed');
    }

    // viewBox가 없으면 원본 width/height 속성에서 복원
    if (!svg.hasAttribute('viewBox')) {
      const wAttr = svg.getAttribute('width') || '';
      const hAttr = svg.getAttribute('height') || '';
      const w = wAttr.includes('%') ? 0 : parseFloat(wAttr);
      const h = hAttr.includes('%') ? 0 : parseFloat(hAttr);
      if (w > 0 && h > 0) {
        svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
      } else {
        throw new Error('no size info for viewBox');
      }
    }

    // 고정 크기 속성 제거 → CSS(width:100%; height:auto)가 크기 결정
    svg.removeAttribute('width');
    svg.removeAttribute('height');
    svg.removeAttribute('style');
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

    // 🌟 viewBox 비율을 aspect-ratio 로 명시 → height:auto 가 모든 브라우저에서
    //     정확히 동작, 단이 커지는 만큼 국장도 무제한으로 함께 커진다
    const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if (vb.length === 4 && vb[2] > 0 && vb[3] > 0) {
      svg.style.aspectRatio = vb[2] + ' / ' + vb[3];
    }

    wrap.innerHTML = '';
    wrap.appendChild(document.importNode(svg, true));
  } catch(e) {
    console.warn('SVG 인라인 실패, <img> 폴백 처리:', e);
    wrap.innerHTML = `<img class="emblem-img" src="${url}" alt="국장" onerror="this.style.display='none'">`;
  }
}

function switchMobileTab(tab, btn) {
  document.querySelectorAll('.mobile-tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  document.getElementById('col-info').classList.remove('mobile-active');
  document.querySelectorAll('.content-col').forEach(c => c.classList.remove('mobile-active'));

  if (tab === 'info') document.getElementById('col-info').classList.add('mobile-active');
  else if (tab === 'flag') document.getElementById('col-flag').classList.add('mobile-active');
  else if (tab === 'emblem') document.getElementById('col-emblem').classList.add('mobile-active');
  else if (tab === 'anthem') document.getElementById('col-anthem').classList.add('mobile-active');
}

function goHome() {
  document.getElementById('country-page').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
  document.querySelectorAll('.country-item').forEach(el => el.classList.remove('active'));
  history.replaceState(null, '', location.pathname + location.search);
}

function selectRandom() {
  const pool = filtered.length > 0 ? filtered : COUNTRIES;
  if (pool.length === 0) return;
  const idx = Math.floor(Math.random() * pool.length);
  const targetCode = pool[idx].code;
  const filteredIdx = filtered.findIndex(c => c.code === targetCode);
  if (filteredIdx >= 0) {
    selectCountry(filteredIdx);
    const items = document.querySelectorAll('.country-item');
    if (items[filteredIdx]) items[filteredIdx].scrollIntoView({block:'nearest'});
  }
}

/* ── URL 해시로 진입/이동 (#kr → 대한민국) ── */
function goToCode(code) {
  let i = filtered.findIndex(c => c.code === code);
  if (i < 0 && COUNTRIES.some(c => c.code === code)) {
    // 필터에 걸려 안 보이는 나라면 필터를 초기화하고 다시 찾는다
    document.getElementById('search').value = '';
    currentRegion = 'all';
    activeTagFilter = null;
    document.querySelectorAll('.rtab').forEach(b => b.classList.toggle('active', b.dataset.region === 'all'));
    document.querySelectorAll('#tag-pills .tag-pill').forEach(b => b.classList.remove('active'));
    applyFilter('', 'all');
    i = filtered.findIndex(c => c.code === code);
  }
  if (i >= 0) {
    selectCountry(i);
    document.querySelectorAll('.country-item')[i]?.scrollIntoView({block:'nearest'});
  }
}

window.addEventListener('hashchange', function() {
  const code = decodeURIComponent(location.hash.slice(1));
  if (code) goToCode(code);
});

document.addEventListener('keydown', function(e) {
  if (['ArrowLeft','ArrowUp','ArrowRight','ArrowDown'].includes(e.key)) {
    if (document.activeElement.id === 'search') return; 
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navCountry(-1);
    else navCountry(1);
  }
});

loadFromSheet();
