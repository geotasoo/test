<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계지도 색칠하기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>
    <h1>세계지도 색칠하기</h1>
    <span class="badge">시안 8</span>
  </div>
  <div class="actions">
    <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>되돌리기</span>
    </button>
    <button class="btn" id="redo" title="다시 하기 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>다시 하기</span>
    </button>
    <button class="btn" id="clear" title="색칠한 것 모두 지우기">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>모두 지우기</span>
    </button>
  </div>
</header>

<main id="stage">
  <canvas id="map" aria-label="세계지도. 나라를 눌러 색칠하세요."></canvas>
  <div id="loading">지도를 불러오는 중…</div>

  <!-- 왼쪽 위: 도법 · 지도 요소 -->
  <div class="controls" id="controls">
    <div class="seg" id="projSeg" role="group" aria-label="도법 선택" title="도법 바꾸기 (P)">
      <button data-proj="merc">메르카토르</button>
      <button data-proj="ee">이퀄 어스</button>
    </div>
    <button class="pill" id="layersBtn" aria-expanded="false" aria-controls="layersPanel">
      <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      <span>지도 요소</span><b id="layersCount"></b>
      <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="tool-pills">
      <button class="pill tp" data-side="lakes" title="호수 고르기">
        <svg viewBox="0 0 24 24"><path d="M12 3s6 6.6 6 11a6 6 0 0 1-12 0c0-4.4 6-11 6-11z"/></svg><span>호수</span><b class="cnt" id="lakesCount"></b>
      </button>
      <button class="pill tp" data-side="points" title="점찍기 (도시 고르기·직접 찍기)">
        <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>점찍기</span><b class="cnt" id="pointsCount"></b>
      </button>
    </div>
  </div>

  <div class="panel layers-panel" id="layersPanel" hidden>
    <div class="group">
      <h3>경계</h3>
      <div class="row">
        <label class="sw"><input type="checkbox" data-layer="borders"><span></span>국경선</label>
        <div class="inline-range" title="선 굵기">
          <input type="range" id="lineWidth" min="0.2" max="2" step="0.1" aria-label="선 굵기">
          <output id="lineWidthOut"></output>
        </div>
      </div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="kp"><span></span>남북한 경계</label></div>
    </div>
    <div class="group">
      <h3>표시</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="names"><span></span>나라 이름</label></div>
      <div class="row"><label class="sw" title="지도에서 점처럼 작은 나라를 동그라미로 표시"><input type="checkbox" data-layer="tiny"><span></span>작은 나라 동그라미</label></div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="lakes"><span></span>호수</label><button class="link" data-side="lakes">고르기 ›</button></div>
    </div>
    <div class="group">
      <h3>경위선</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="grid"><span></span>경위선과 라벨</label></div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="equator"><span></span>적도</label></div>
    </div>
    <div class="group">
      <h3>정보</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="scale"><span></span>축척 (1 : ○○○)</label></div>
    </div>
  </div>

  <!-- 오른쪽 위: 확대·축소 -->
  <div class="zoom">
    <button id="zoomIn" title="확대 (+)">+</button>
    <button id="zoomOut" title="축소 (−)">−</button>
    <button id="home" title="세계 전체 보기">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <!-- 팔레트: PC·태블릿은 왼쪽 세로, 폰은 아래 -->
  <button class="dock-open" id="dockOpen" title="팔레트 열기"><span class="dot"></span><span class="lbl">팔레트</span></button>
  <aside class="dock" id="dock" aria-label="팔레트">
    <div class="dock-head">
      <span class="dock-title">팔레트</span>
      <button class="dock-hide" id="dockHide" title="팔레트 접기"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="tabs" id="paletteTabs"></div>
    <div class="swatches" id="swatches"></div>
    <div class="tools">
      <label class="custom" title="원하는 색 고르기">
        <input type="color" id="customColor" value="#F9C74F">
        <span class="ring"></span><span class="lbl">직접 고르기</span>
      </label>
      <button class="tool" id="eraser" title="지우개 (E)">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21z"/><path d="M22 21H7M5 11l9 9"/></svg>
        <span>지우개</span>
      </button>
    </div>
    <div class="base">
      <div class="base-row"><span>육지</span><div class="mini-swatches" data-target="land"></div></div>
      <div class="base-row"><span>바다</span><div class="mini-swatches" data-target="ocean"></div></div>
    </div>
    <div class="status"><span id="count">칠한 나라 0개</span></div>
  </aside>

  <!-- 오른쪽 패널 (폰은 아래 시트): 호수 · 도시 · 점찍기 -->
  <aside class="side" id="side" hidden>
    <section data-panel="lakes">
      <header class="side-head">
        <h2>호수</h2>
        <button class="sbtn" id="lakesNone">전체 해제</button>
        <button class="sbtn" id="lakesDefault">기본값</button>
        <button class="close" data-close title="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </header>
      <div class="side-body">
        <div class="note" id="lakesSummary"></div>
        <h3 class="sub">주요 호수</h3>
        <div class="checklist" id="lakeList"></div>
        <h3 class="sub">전체 호수</h3>
        <p class="hint">세계 호수 약 400개를 한 번에 표시해요. 참고용이라 하나씩 고를 수는 없어요.</p>
        <label class="chk"><input type="checkbox" id="lakesAll"><span>전체 호수 표시</span></label>
      </div>
    </section>

    <section data-panel="points">
      <header class="side-head">
        <button class="sheet-handle" id="sheetToggle" title="시트 접기/펴기" aria-label="시트 접기/펴기"></button>
        <h2>점찍기</h2>
        <button class="sbtn primary" data-close>완료</button>
      </header>
      <div class="pstyle">
        <div class="prow"><span class="plabel">색</span><div class="pcolors" id="pColors"></div></div>
        <div class="prow"><span class="plabel">모양</span><div class="pshapes" id="pShapes"></div></div>
        <div class="prow"><span class="plabel">크기</span><input type="range" id="pSize" min="3" max="14" step="1"><output id="pSizeOut"></output>
          <label class="sw small" title="점 테두리"><input type="checkbox" id="pOutline"><span></span>테두리</label></div>
        <div class="prow"><span class="plabel">글자</span><input type="range" id="pFont" min="9" max="30" step="1" aria-label="라벨 글자 크기"><output id="pFontOut"></output></div>
      </div>
      <div class="ptabs" role="tablist">
        <button data-ptab="cities" class="sel">도시 고르기</button>
        <button data-ptab="list">찍은 점 <b id="plistCount"></b></button>
        <button data-ptab="style" class="phone-only">점 모양 <i class="sty-dot" id="styDot"></i></button>
      </div>
      <div class="side-body" data-pbody="cities">
        <div class="side-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="citySearch" type="search" placeholder="도시 검색"></div>
        <p class="hint tip">목록에 없는 곳은 <b>지도를 눌러</b> 직접 찍어요.</p>
        <div id="cityGroups"></div>
      </div>
      <div class="side-body" data-pbody="list" hidden>
        <div class="fillbar">
          <span>라벨 한꺼번에</span>
          <button data-fill="alpha">A B C</button><button data-fill="hangul">(가)(나)</button><button data-fill="city">도시 이름</button><button data-fill="clear">지우기</button>
        </div>
        <p class="hint tip">줄을 <b>⋮⋮</b>로 끌면 순서가 바뀌어요. 지도에서 <b>라벨을 끌면</b> 가이드선이 생겨요.</p>
        <div class="plist" id="pointList"></div>
        <div class="plist-foot"><button class="sbtn" id="pointsClear">전체 삭제</button></div>
      </div>
    </section>
  </aside>

  <div class="mode-banner" id="pointBanner" hidden>
    <svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span>점찍기 중 · 지도를 누르면 점이 찍혀요</span>
    <button data-close>완료</button>
  </div>

  <div id="tip" role="status"></div>
  <div id="toast" role="status"><span></span><button hidden>되돌리기</button></div>

  <!-- 아래: 왼쪽 도법·출처, 오른쪽 축척 (축척은 지도 그림에 그려요) -->
  <div class="credit"><b id="projName"></b><span class="src"> · 지도 데이터: Natural Earth · @geotasoo</span></div>
</main>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="data/places.js"></script>
<script src="app.js"></script>
</body>
</html>
