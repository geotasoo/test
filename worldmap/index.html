<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계지도 색칠하기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>
    <h1>세계지도 색칠하기</h1>
    <span class="badge">시안 4</span>
  </div>
  <div class="actions">
    <button class="btn" id="undo" title="되돌리기 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>되돌리기</span>
    </button>
    <button class="btn" id="redo" title="다시 하기 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg><span>다시 하기</span>
    </button>
    <button class="btn" id="clear" title="색칠한 것 모두 지우기">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5.5 7l1 12a2 2 0 0 0 2 2h7a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg><span>모두 지우기</span>
    </button>
  </div>
</header>

<main id="stage">
  <canvas id="map" aria-label="세계지도. 나라를 눌러 색칠하세요."></canvas>
  <div id="loading">지도를 불러오는 중…</div>

  <!-- 왼쪽 위: 도법 · 지도 요소 -->
  <div class="controls" id="controls">
    <div class="seg" id="projSeg" role="group" aria-label="도법 선택" title="도법 바꾸기 (P)">
      <button data-proj="merc">메르카토르</button>
      <button data-proj="ee">이퀄 어스</button>
    </div>
    <button class="pill" id="layersBtn" aria-expanded="false" aria-controls="layersPanel">
      <svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5z"/><path d="m3 13 9 5 9-5"/></svg>
      <span>지도 요소</span><b id="layersCount"></b>
      <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </div>

  <div class="panel layers-panel" id="layersPanel" hidden>
    <div class="group">
      <h3>경계</h3>
      <div class="row">
        <label class="sw"><input type="checkbox" data-layer="borders"><span></span>국경선</label>
        <div class="inline-range" title="선 굵기">
          <input type="range" id="lineWidth" min="0.2" max="2" step="0.1" aria-label="선 굵기">
          <output id="lineWidthOut"></output>
        </div>
      </div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="kp"><span></span>남북한 경계</label></div>
    </div>
    <div class="group">
      <h3>표시</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="names"><span></span>나라 이름</label></div>
      <div class="row"><label class="sw" title="지도에서 점처럼 작은 나라를 동그라미로 표시"><input type="checkbox" data-layer="tiny"><span></span>작은 나라 동그라미</label></div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="lakes"><span></span>호수</label></div>
    </div>
    <div class="group">
      <h3>경위선</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="grid"><span></span>경위선과 라벨</label></div>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="equator"><span></span>적도</label></div>
    </div>
    <div class="group">
      <h3>정보</h3>
      <div class="row"><label class="sw"><input type="checkbox" data-layer="scale"><span></span>축척 (1 : ○○○)</label></div>
    </div>
  </div>

  <!-- 오른쪽 위: 확대·축소 -->
  <div class="zoom">
    <button id="zoomIn" title="확대 (+)">+</button>
    <button id="zoomOut" title="축소 (−)">−</button>
    <button id="home" title="세계 전체 보기">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>

  <!-- 팔레트: PC·태블릿은 왼쪽 세로, 폰은 아래 -->
  <button class="dock-open" id="dockOpen" title="팔레트 열기"><span class="dot"></span><span class="lbl">팔레트</span></button>
  <aside class="dock" id="dock" aria-label="팔레트">
    <div class="dock-head">
      <span class="dock-title">팔레트</span>
      <button class="dock-hide" id="dockHide" title="팔레트 접기"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    </div>
    <div class="tabs" id="paletteTabs"></div>
    <div class="swatches" id="swatches"></div>
    <div class="tools">
      <label class="custom" title="원하는 색 고르기">
        <input type="color" id="customColor" value="#F9C74F">
        <span class="ring"></span><span class="lbl">직접 고르기</span>
      </label>
      <button class="tool" id="eraser" title="지우개 (E)">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L11 21z"/><path d="M22 21H7M5 11l9 9"/></svg>
        <span>지우개</span>
      </button>
    </div>
    <div class="base">
      <div class="base-row"><span>육지</span><div class="mini-swatches" data-target="land"></div></div>
      <div class="base-row"><span>바다</span><div class="mini-swatches" data-target="ocean"></div></div>
    </div>
    <div class="status"><span id="count">칠한 나라 0개</span></div>
  </aside>

  <div id="tip" role="status"></div>
  <div id="toast" role="status"><span></span><button hidden>되돌리기</button></div>

  <!-- 아래: 왼쪽 도법·출처, 오른쪽 축척 (축척은 지도 그림에 그려요) -->
  <div class="credit"><b id="projName"></b><span class="src"> · 지도 데이터: Natural Earth · @geotasoo</span></div>
</main>

<script src="lib/d3.min.js"></script>
<script src="lib/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
